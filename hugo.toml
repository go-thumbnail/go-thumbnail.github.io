baseURL = 'https://go-thumbnail.github.io/'
locale  = 'en-us'
title   = 'go-thumbnail'
# No theme — layouts live in ./layouts

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  titleSuffix = "pure-Go freedesktop thumbnails"
  description = "go-thumbnail is a pure-Go (CGO=0) implementation of the freedesktop.org Thumbnail Managing Standard: a spec-faithful thumbnail cache that interoperates with existing desktop tools."
  brandName       = "go-thumbnail"
  github      = "go-thumbnail"
  heroAccent  = "go-thumbnail"
  heroTagline = "The freedesktop.org Thumbnail Managing Standard, in pure Go. No cgo, no external tools."

  heroIntro = [
    "<strong>go-thumbnail</strong> is a pure-Go (<code>CGO_ENABLED=0</code>) implementation of the freedesktop.org <a href=\"https://specifications.freedesktop.org/thumbnail/latest-single/\">Thumbnail Managing Standard</a>. It generates and caches file thumbnails <strong>exactly where and how the standard prescribes</strong>, so the thumbnails it writes are visible to other compliant tools &mdash; file managers, image viewers &mdash; and vice-versa.",
    "Canonical cache under <code>$XDG_CACHE_HOME/thumbnails</code> in the standard size buckets, the required PNG metadata, fail markers, and shared-repository handling &mdash; a single portable module that cross-compiles to a static binary."
  ]

[menu]
  [[menu.main]]
    identifier = "why"
    name       = "Why"
    url        = "#why"
    weight     = 10
  [[menu.main]]
    identifier = "repos"
    name       = "Module"
    url        = "#repos"
    weight     = 20
  [[menu.main]]
    identifier = "quality"
    name       = "Quality"
    url        = "#quality"
    weight     = 30
  [[menu.main]]
    identifier = "docs"
    name       = "Docs"
    url        = "https://go-thumbnail.github.io/docs/"
    weight     = 40

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.47:1, bright on the dark background 10.38:1.
  base = "#0f766e"
  deep = "#094843"
  bright = "#2dd4bf"
  shadow = "rgba(15,118,110,.7)"
  glow = "rgba(15,118,110,.6)"
  wash = "rgba(15,118,110,.10)"
  washDeep = "rgba(9,72,67,.06)"
  chipBg = "#e6faf7"
  chipBorder = "#c0f2ec"
  chipFg = "#094843"
  chipBgDark = "rgba(45,212,191,.14)"
  chipBorderDark = "rgba(45,212,191,.32)"
  chipFgDark = "#8ce7dc"
  statsEnd = "#cdf5f0"
  bandText = "#ddf8f5"
  accent = "#0f766e"
  accentDark = "#2dd4bf"
